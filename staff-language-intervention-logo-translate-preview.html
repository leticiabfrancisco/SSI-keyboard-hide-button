<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Language Intervention — Logo Translate Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.js" type="module"></script>
    <style>
      :root {
        --surface: #f4f4f5;
        --paper: #fafafa;
        --text: #18181b;
        --text-secondary: #52525b;
        --divider: #e4e4e7;
        --outline-low: #a1a1aa;
        --primary: #18181b;
        --danger: #c81e1e;
        --danger-strong: #b91c1c;
        --danger-soft: #fef2f2;
        --shadow-card:
          rgba(54, 48, 163, 0) 171px 244px 83px 0px,
          rgba(54, 48, 163, 0.01) 109px 156px 76px 0px,
          rgba(54, 48, 163, 0.02) 62px 88px 64px 0px,
          rgba(54, 48, 163, 0.03) 27px 39px 48px 0px,
          rgba(54, 48, 163, 0.04) 7px 10px 26px 0px;
        --shadow-btn:
          rgba(54, 48, 163, 0) 51px 73px 25px 0px,
          rgba(54, 48, 163, 0) 33px 47px 23px 0px,
          rgba(54, 48, 163, 0.02) 18px 26px 19px 0px,
          rgba(54, 48, 163, 0.03) 8px 12px 14px 0px,
          rgba(54, 48, 163, 0.03) 2px 3px 8px 0px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #ffffff 0%, #ebebed 40%, #e2e2e5 100%);
        font-family: 'Inter', sans-serif;
        color: var(--text);
      }

      .ms {
        font-family: 'Material Symbols Rounded';
        font-size: 20px;
        line-height: 1;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        user-select: none;
      }

      .shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 24px;
        border-bottom: 1px solid var(--divider);
        background: rgba(244, 244, 245, 0.92);
      }

      .topbar-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .topbar-logo {
        width: 26px;
        height: 26px;
        display: block;
      }

      .topbar-title {
        font-size: 16px;
        letter-spacing: -0.16px;
      }

      .translate-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 40px;
        padding: 0;
        border: 1px solid var(--outline-low);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        touch-action: manipulation;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .translate-toggle:hover {
        background: rgba(24, 24, 27, 0.05);
      }

      .translate-toggle:active {
        background: rgba(24, 24, 27, 0.1);
      }

      .translate-toggle:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .translate-toggle .ms {
        font-size: 22px;
      }

      .translate-toggle.is-active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .error-banner {
        align-self: center;
        margin-top: 20px;
        display: inline-flex;
        align-items: center;
        flex-direction: row;
        gap: 10px;
        min-height: 44px;
        padding: 0 14px 0 16px;
        border-radius: 8px;
        background: var(--danger);
        color: #fff;
        box-shadow: var(--shadow-btn);
      }

      .error-banner-title {
        font-size: 14px;
        font-weight: 500;
        flex: 1;
      }

      .error-banner-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        color: #fff;
        cursor: pointer;
        padding: 0;
        opacity: 0.8;
        transition: opacity 0.12s ease;
      }

      .error-banner-close:hover {
        opacity: 1;
      }

      .progress {
        margin: 16px auto 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-secondary);
        font-size: 15px;
      }

      /* English reads left-to-right: 1 Receipts — 2 Profile — 3 Refund — 4 Form. */
      html[lang='en'] .progress {
        flex-direction: row-reverse;
      }

      .step-chip {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
        background: var(--outline-low);
        color: #fff;
      }

      .step-chip.active {
        background: var(--primary);
      }

      .main {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 28px 24px 120px;
      }

      .card {
        width: min(100%, 774px);
        background: rgba(250, 250, 250, 0.92);
        border-radius: 8px;
        box-shadow: var(--shadow-card);
        padding: 34px 46px 30px;
      }

      .card-grid {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 28px;
        align-items: center;
      }

      /* English: text on the left, illustration on the right. */
      html[lang='en'] .card-grid {
        grid-template-columns: 1fr 220px;
      }

      html[lang='en'] .copy {
        order: 1;
      }

      html[lang='en'] .illustration-wrap {
        order: 2;
      }

      .receipt-illus {
        width: 160px;
        height: 210px;
        border: 4px solid #cfd4dc;
        border-radius: 10px 10px 0 0;
        position: relative;
        margin: 0 auto;
      }

      .receipt-illus::before {
        content: 'RECEIPT';
        position: absolute;
        top: 16px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        color: #8b93a1;
      }

      .receipt-illus::after {
        content: '';
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 20px;
        height: 42px;
        background:
          repeating-linear-gradient(
            to right,
            #b7bfca 0 4px,
            transparent 4px 8px,
            #b7bfca 8px 12px,
            transparent 12px 15px
          );
        border-radius: 4px;
      }

      .receipt-line,
      .receipt-line-short {
        position: absolute;
        left: 14px;
        height: 4px;
        background: #d8dde4;
        border-radius: 999px;
      }

      .receipt-line:nth-child(1) { top: 52px; width: 78px; }
      .receipt-line:nth-child(2) { top: 68px; width: 92px; }
      .receipt-line:nth-child(3) { top: 84px; width: 110px; }
      .receipt-line:nth-child(4) { top: 100px; width: 96px; }
      .receipt-line:nth-child(5) { top: 132px; width: 84px; }
      .receipt-line-short:nth-child(6) { top: 52px; right: 14px; left: auto; width: 18px; }
      .receipt-line-short:nth-child(7) { top: 68px; right: 14px; left: auto; width: 14px; }
      .receipt-line-short:nth-child(8) { top: 84px; right: 14px; left: auto; width: 18px; }
      .receipt-line-short:nth-child(9) { top: 132px; right: 14px; left: auto; width: 30px; }

      .receipt-tear {
        position: absolute;
        left: -4px;
        right: -4px;
        bottom: -13px;
        height: 18px;
        background:
          radial-gradient(circle at 12px 0, transparent 9px, #cfd4dc 9px 11px, transparent 11px) 0 0 / 32px 18px repeat-x;
      }

      .copy h1 {
        margin: 0 0 18px;
        font-size: 28px;
        line-height: 1.35;
        font-weight: 400;
        letter-spacing: -1px;
      }

      .primary-btn {
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 8px;
        background: #060919;
        color: #fff;
        font: inherit;
        font-size: 17px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: var(--shadow-btn);
        cursor: pointer;
        touch-action: manipulation;
      }

      .footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        border-top: 1px solid var(--divider);
        background: rgba(250, 250, 250, 0.92);
      }

      /* English: Next on the right, Cancel on the left. */
      html[lang='en'] .footer {
        flex-direction: row-reverse;
      }

      .footer-btn {
        min-width: 86px;
        min-height: 54px;
        padding: 0 22px;
        border-radius: 8px;
        font: inherit;
        font-size: 18px;
        cursor: default;
      }

      .footer-btn.secondary {
        border: 1px solid var(--outline-low);
        background: transparent;
        color: var(--text);
      }

      .footer-btn.primary {
        border: 0;
        background: var(--primary);
        color: #fff;
        box-shadow: var(--shadow-btn);
      }

      /* ── Language Picker Modal ── */
      .lang-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }

      .lang-backdrop.open {
        display: flex;
      }

      .lang-modal {
        background: #fafafa;
        border-radius: 16px;
        padding: 28px 32px 32px;
        width: min(90vw, 620px);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.18),
          0 4px 16px rgba(0, 0, 0, 0.08);
        animation: modal-in 0.18s ease;
      }

      @keyframes modal-in {
        from { opacity: 0; transform: scale(0.96) translateY(8px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
      }

      .lang-modal-header {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin: 0 0 20px;
      }

      .lang-modal-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 17px;
        font-weight: 500;
        color: var(--text);
        margin: 0;
      }

      .lang-modal-title .ms {
        font-size: 22px;
      }

      .lang-modal-close {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 32px;
        height: 32px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        color: var(--text-secondary);
        transition: background 0.12s ease, color 0.12s ease;
      }

      .lang-modal-close:hover {
        background: rgba(24, 24, 27, 0.08);
        color: var(--text);
      }

      .lang-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }

      .lang-btn {
        padding: 12px 8px;
        border: 1px solid rgba(3, 7, 18, 0.5);
        border-radius: 8px;
        background: transparent;
        font: inherit;
        font-size: 15px;
        color: var(--text);
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease;
        text-align: center;
      }

      .lang-btn:hover {
        background: rgba(24, 24, 27, 0.06);
        border-color: var(--outline-low);
      }

      .lang-btn:active {
        background: rgba(24, 24, 27, 0.12);
      }

      .lang-btn.selected {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      @media (max-width: 900px) {
        .card {
          padding: 24px;
        }

        .card-grid {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .main {
          padding-bottom: 32px;
        }

        .footer {
          position: static;
          padding: 20px 24px;
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="topbar-brand">
          <img class="topbar-logo" src="assets/planet-p-icon-black.svg" alt="Planet" />
          <div class="topbar-title">Tax Free form</div>
        </div>
        <button
          class="translate-toggle"
          id="translate-toggle"
          type="button"
          aria-pressed="false"
          aria-label="Translate page"
          title="Translate"
        >
          <span class="ms">translate</span>
        </button>
      </header>

      <div class="error-banner" aria-live="polite" role="alert">
        <span class="ms" aria-hidden="true">error</span>
        <div class="error-banner-title" id="error-banner-title">أضف إيصالاً للمتابعة</div>
        <button class="error-banner-close" type="button" aria-label="Dismiss">
          <span class="ms">close</span>
        </button>
      </div>

      <div class="progress" aria-label="Progress">
        <span id="step-label-form">النموذج</span>
        <span class="step-chip">4</span>
        <span>–</span>
        <span id="step-label-refund">الاسترداد</span>
        <span class="step-chip">3</span>
        <span>–</span>
        <span id="step-label-profile">الملف الشخصي</span>
        <span class="step-chip">2</span>
        <span>–</span>
        <span id="step-label-receipts">الإيصالات</span>
        <span class="step-chip active">1</span>
      </div>

      <main class="main">
        <section class="card" aria-labelledby="scan-title">
          <div class="card-grid">
            <div class="illustration-wrap" aria-hidden="true">
              <dotlottie-player
                src="assets/scan-receipt-barcode.json"
                autoplay
                loop
                style="width: 220px; height: 220px; margin: 0 auto; display: block;"
              ></dotlottie-player>
            </div>

            <div class="copy">
              <h1 id="scan-title">امسح الباركود الموجود على الإيصال</h1>
              <button class="primary-btn" id="scan-button" type="button">
                <span id="scan-button-label">بدء المسح</span>
                <span class="ms">photo_camera</span>
              </button>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <button class="footer-btn primary" id="next-button" type="button">التالي</button>
        <button class="footer-btn secondary" id="cancel-button" type="button">إلغاء</button>
      </footer>
    </div>

    <!-- Language picker modal -->
    <div class="lang-backdrop" id="lang-backdrop" role="dialog" aria-modal="true" aria-label="Select language">
      <div class="lang-modal">
        <div class="lang-modal-header">
          <p class="lang-modal-title">
            <span class="ms">language</span>
            Select your language
          </p>
          <button class="lang-modal-close" id="lang-modal-close" type="button" aria-label="Close language picker">
            <span class="ms">close</span>
          </button>
        </div>
        <div class="lang-grid">
          <button class="lang-btn" data-lang="en" type="button">English</button>
          <button class="lang-btn" data-lang="ar" type="button">العربية</button>
          <button class="lang-btn" data-lang="zh" type="button">简体中文</button>
          <button class="lang-btn" data-lang="es" type="button">Español</button>
          <button class="lang-btn" data-lang="fr" type="button">Français</button>
          <button class="lang-btn" data-lang="ko" type="button">한국어</button>
          <button class="lang-btn" data-lang="ja" type="button">日本語</button>
          <button class="lang-btn" data-lang="pt" type="button">Português</button>
          <button class="lang-btn" data-lang="tr" type="button">Türkçe</button>
          <button class="lang-btn" data-lang="hi" type="button">हिन्दी</button>
        </div>
      </div>
    </div>

    <script>
      const translateToggle = document.getElementById('translate-toggle');
      const langBackdrop = document.getElementById('lang-backdrop');
      let isEnglishSession = false;

      const COPY = {
        ar: {
          'error-banner-title': 'أضف إيصالاً للمتابعة',
          'step-label-form': 'النموذج',
          'step-label-refund': 'الاسترداد',
          'step-label-profile': 'الملف الشخصي',
          'step-label-receipts': 'الإيصالات',
          'scan-title': 'امسح الباركود الموجود على الإيصال',
          'scan-button-label': 'بدء المسح',
          'next-button': 'التالي',
          'cancel-button': 'إلغاء',
        },
        en: {
          'error-banner-title': 'Add a receipt to continue',
          'step-label-form': 'Form',
          'step-label-refund': 'Refund',
          'step-label-profile': 'Profile',
          'step-label-receipts': 'Receipts',
          'scan-title': 'Scan the barcode on the receipt',
          'scan-button-label': 'Start scan',
          'next-button': 'Next',
          'cancel-button': 'Cancel',
        },
      };

      const setText = (id, value) => {
        const element = document.getElementById(id);
        if (element) element.textContent = value;
      };

      const applyLanguage = (lang) => {
        // Only ar and en have full translations; all others fall back to en display.
        const copy = COPY[lang] || COPY['en'];
        const htmlLang = COPY[lang] ? lang : 'en';
        document.documentElement.setAttribute('lang', htmlLang);
        Object.keys(copy).forEach((key) => setText(key, copy[key]));

        isEnglishSession = lang !== 'ar';

        // Highlight selected lang button
        document.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.classList.toggle('selected', btn.dataset.lang === lang);
        });
      };

      // ── Modal open / close ──
      const openPicker = () => {
        langBackdrop.classList.add('open');
        langBackdrop.querySelector('.lang-btn').focus();
      };

      const closePicker = () => {
        langBackdrop.classList.remove('open');
        translateToggle.focus();
      };

      translateToggle.addEventListener('click', openPicker);

      // Close button
      document.getElementById('lang-modal-close').addEventListener('click', closePicker);

      // Close on backdrop click
      langBackdrop.addEventListener('click', (e) => {
        if (e.target === langBackdrop) closePicker();
      });

      // Close on Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && langBackdrop.classList.contains('open')) closePicker();
      });

      // Language button clicks
      langBackdrop.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const lang = btn.dataset.lang;
          applyLanguage(lang);
          closePicker();
        });
      });

      // Mark current language (Arabic) as selected on load
      document.querySelector('.lang-btn[data-lang="ar"]').classList.add('selected');
    </script>
  </body>
</html>
