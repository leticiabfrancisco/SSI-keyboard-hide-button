<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPad — Choose Payment Method</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <style>
      /* ── Planet / Solar DS tokens ── */
      :root {
        --surface:        #f4f4f5;
        --paper:          #fafafa;
        --text:           #18181b;
        --text-secondary: #52525b;
        --divider:        #e4e4e7;
        --outline-low:    #a1a1aa;
        --primary:        #18181b;
        /* CornerLightning elevation-5 */
        --shadow-card:
          rgba(54, 48, 163, 0)    171px 244px 83px 0px,
          rgba(54, 48, 163, 0.01) 109px 156px 76px 0px,
          rgba(54, 48, 163, 0.02)  62px  88px 64px 0px,
          rgba(54, 48, 163, 0.03)  27px  39px 48px 0px,
          rgba(54, 48, 163, 0.04)   7px  10px 26px 0px;
        /* CornerLightning button shadow */
        --shadow-btn:
          rgba(54, 48, 163, 0)    51px 73px 25px 0px,
          rgba(54, 48, 163, 0)    33px 47px 23px 0px,
          rgba(54, 48, 163, 0.02) 18px 26px 19px 0px,
          rgba(54, 48, 163, 0.03)  8px 12px 14px 0px,
          rgba(54, 48, 163, 0.03)  2px  3px  8px 0px;
        /* spacing base 8px */
        --sp1: 8px;
        --sp2: 16px;
        --sp3: 24px;
        --sp4: 32px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #d1d1d6;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Inter', sans-serif;
        color: var(--text);
        padding: var(--sp4);
      }

      .ms {
        font-family: 'Material Symbols Rounded';
        font-size: 22px;
        line-height: 1;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        user-select: none;
      }
      .ms.filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

      /* ── iPad landscape shell (1194×834 inner) ── */
      .ipad {
        width: 1214px;   /* 1194 content + 10px bezel each side */
        height: 854px;   /* 834 content + 10px bezel each side */
        background: var(--surface);
        border-radius: 20px;
        box-shadow: 0 40px 80px -20px rgba(0,0,0,0.45),
                    inset 0 0 0 1px rgba(255,255,255,0.10);
        border: 10px solid #2a2a2c;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      /* Home-bar pill at bottom of iPad */
      .home-bar {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 4px;
        border-radius: 2px;
        background: rgba(0,0,0,0.25);
        z-index: 10;
      }

      /* ── PageHead — 57px ── */
      .topbar {
        flex-shrink: 0;
        height: 57px;
        background: var(--surface);
        border-bottom: 1px solid var(--divider);
        display: flex;
        align-items: center;
        padding: 0 var(--sp2);
        gap: var(--sp1);
      }

      .planet-logo { width: 24px; height: 24px; flex-shrink: 0; }
      .planet-logo img { width: 24px; height: 24px; display: block; }

      .topbar-title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.17px;
      }

      /* ── Content area — scrollable, max-width 800px centered ── */
      .content-wrap {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: var(--sp4) var(--sp3) 0;
      }

      .content-inner {
        width: 100%;
        max-width: 800px;
        display: flex;
        flex-direction: column;
        gap: var(--sp3);
        padding-bottom: var(--sp4);
      }

      /* ── Stepper — inline circle + label + dash, ~384px, centered ── */
      .stepper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 384px;
        margin: 0 auto var(--sp4);
      }

      .step {
        display: flex;
        align-items: center;   /* label sits RIGHT of circle, same row */
        gap: 6px;
        flex-shrink: 0;
      }

      .step-circle {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #18181b;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .step.future .step-circle {
        background: var(--outline-low);  /* solid grey fill, white number */
        border: none;
        color: #fff;
      }

      .step-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .step.active .step-label { color: var(--text); font-weight: 700; }
      .step.done   .step-label { color: var(--text-secondary); }

      /* Dash connector — character, not a line */
      .step-dash {
        font-size: 13px;
        color: var(--text-secondary);
        flex-shrink: 0;
        line-height: 1;
      }

      /* ── Section heading ── */
      .section-title {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.24px;
        line-height: 1.4;
        color: var(--text);
      }

      .section-subtitle {
        font-size: 14px;
        color: var(--text-secondary);
        margin-top: 4px;
        line-height: 1.5;
      }

      /* ── Selection — outer white Paper card + inner bordered rows ── */
      .selection-card {
        background: var(--paper);
        border-radius: 12px;
        box-shadow: var(--shadow-card);
        padding: var(--sp2) var(--sp3) var(--sp3);
      }

      .selection-heading {
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -1px;
        line-height: 1.4;
        color: var(--text);
        margin-bottom: var(--sp2);
      }

      /* Inner 2-column grid — no gap, border collapse handled per cell */
      .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--sp2);
      }

      /* Each option: inner rounded box inside the white card */
      .option-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: var(--sp2) var(--sp2);
        background: #fafafa;
        border-radius: 8px;
        border: 1px solid var(--divider);
        cursor: pointer;
        min-height: 56px;
        transition: border-color 100ms ease, border-width 100ms ease;
        font-family: 'Inter', sans-serif;
        width: 100%;
        text-align: left;
      }

      /* Selected: dark border, slightly thicker */
      .option-card.selected {
        background: #f0f0f0;
        border: 1.5px solid #18181b;
      }

      /* Icon — plain, no wrapper background */
      .option-icon { color: var(--text); flex-shrink: 0; }
      .option-icon .ms { font-size: 24px; }

      /* Label only — no description */
      .option-label {
        flex: 1;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.1px;
        line-height: 1.3;
        color: var(--text);
      }

      /* Radio */
      .radio {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1.5px solid var(--outline-low);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .option-card.selected .radio { border-color: #18181b; background: #18181b; }
      .radio-dot {
        width: 8px; height: 8px;
        border-radius: 50%; background: #fff;
        display: none;
      }
      .option-card.selected .radio-dot { display: block; }

      /* ── Instruction card — separate white Paper below, large title + illustration right ── */
      .instruction-card {
        background: var(--paper);
        border-radius: 12px;
        box-shadow: var(--shadow-card);
        padding: var(--sp4);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp3);
        animation: fadeIn 150ms ease;
      }

      .instruction-card.hidden { display: none; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .instruction-text { flex: 1; }

      .instruction-title {
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.5px;
        line-height: 1.3;
        color: var(--text);
      }

      .instruction-sub {
        font-size: 14px;
        color: var(--text-secondary);
        margin-top: var(--sp1);
        line-height: 1.5;
        font-weight: 400;
      }

      /* Card reader illustration — greyed outline rectangle */
      .instruction-illustration {
        width: 100px;
        height: 150px;
        flex-shrink: 0;
        border: 2px solid #d4d4d8;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 10px 8px;
        position: relative;
      }

      /* Top strip — mimics card reader slot */
      .illus-strip {
        width: 60%;
        height: 4px;
        border-radius: 2px;
        background: #d4d4d8;
      }

      /* Screen area inside the terminal */
      .illus-screen {
        width: 80%;
        flex: 1;
        border-radius: 4px;
        border: 1.5px solid #d4d4d8;
        margin: 6px 0;
      }

      /* Bottom row of dots */
      .illus-dots {
        display: flex;
        gap: 5px;
      }
      .illus-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #d4d4d8;
      }

      /* ── Footer — 104px, sticky bottom ── */
      .footer {
        flex-shrink: 0;
        height: 104px;
        border-top: 1px solid var(--divider);
        background: var(--paper);
        padding: 0 var(--sp3);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      /* Cancel — outlined */
      .btn-cancel {
        height: 52px;
        padding: 0 var(--sp3);
        border: 1.5px solid var(--divider);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font-size: 18px;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        letter-spacing: -0.1px;
      }

      /* Back — text with icon */
      .btn-back {
        height: 52px;
        padding: 0 var(--sp2);
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 18px;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        letter-spacing: -0.1px;
      }
      .btn-back .ms { font-size: 20px; }

      /* Next — contained primary */
      .btn-next {
        height: 52px;
        padding: 0 var(--sp4);
        border: none;
        border-radius: 8px;
        background: #18181b;
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        box-shadow: var(--shadow-btn);
        letter-spacing: -0.1px;
      }

      .footer-right {
        display: flex;
        align-items: center;
        gap: var(--sp2);
      }
    </style>
  </head>
  <body>
    <div class="ipad">
      <!-- Home bar -->
      <div class="home-bar"></div>

      <!-- PageHead: Planet logo + title -->
      <header class="topbar">
        <div class="planet-logo">
          <img src="assets/planet-p-icon-black.svg" alt="Planet" />
        </div>
        <span class="topbar-title">Tax Free form</span>
      </header>

      <!-- Scrollable content — max-width 800px centered -->
      <div class="content-wrap">
        <div class="content-inner">

          <!-- Stepper: inline circle + label + dash — step 3 active, 1+2 done -->
          <div class="stepper" role="list" aria-label="Progress">
            <div class="step done" role="listitem">
              <div class="step-circle"><img src="assets/stepper-check.svg" width="14" height="14" alt="" /></div>
              <div class="step-label">Receipts</div>
            </div>
            <span class="step-dash" aria-hidden="true">–</span>
            <div class="step done" role="listitem">
              <div class="step-circle"><img src="assets/stepper-check.svg" width="14" height="14" alt="" /></div>
              <div class="step-label">Profile</div>
            </div>
            <span class="step-dash" aria-hidden="true">–</span>
            <div class="step active" role="listitem">
              <div class="step-circle">3</div>
              <div class="step-label">Refund</div>
            </div>
            <span class="step-dash" aria-hidden="true">–</span>
            <div class="step future" role="listitem">
              <div class="step-circle">4</div>
              <div class="step-label">Form</div>
            </div>
          </div>

          <!-- One white Paper card: heading + 2-column option rows -->
          <div class="selection-card">
            <div class="selection-heading">Select your refund method</div>
            <div class="options-grid" role="radiogroup" aria-label="Refund method">

                    <button class="option-card selected" role="radio" aria-checked="true"
                      onclick="selectMethod(this,'card')" aria-label="Card" data-method="card">
                <div class="option-icon"><span class="ms">credit_card</span></div>
                <div class="option-label">Card</div>
                <div class="radio"><div class="radio-dot"></div></div>
              </button>

                    <button class="option-card" role="radio" aria-checked="false"
                      onclick="selectMethod(this,'alipay')" aria-label="Alipay" data-method="alipay">
                <div class="option-icon"><span class="ms">qr_code_scanner</span></div>
                <div class="option-label">Alipay</div>
                <div class="radio"><div class="radio-dot"></div></div>
              </button>

                    <button class="option-card" role="radio" aria-checked="false"
                      onclick="selectMethod(this,'cash')" aria-label="Cash" data-method="cash">
                <div class="option-icon"><span class="ms">payments</span></div>
                <div class="option-label">Cash</div>
                <div class="radio"><div class="radio-dot"></div></div>
              </button>

                    <button class="option-card" role="radio" aria-checked="false"
                      onclick="selectMethod(this,'cashAirport')" aria-label="Cash at Airport" data-method="cashAirport">
                <div class="option-icon"><span class="ms">local_airport</span></div>
                <div class="option-label">Cash at Airport</div>
                <div class="radio"><div class="radio-dot"></div></div>
              </button>

            </div>
          </div>

          <!-- Instruction card: separate Paper, large title + card reader illustration right -->
          <div class="instruction-card" id="instruction-card">
            <div class="instruction-text">
              <div class="instruction-title" id="instruction-title">
                Tap, swipe or insert your card on the card reader
              </div>
              <div class="instruction-sub" id="instruction-sub">
                Your VAT refund goes to this card once approved
              </div>
            </div>
            <div class="instruction-illustration" id="instruction-illustration">
              <div class="illus-strip"></div>
              <div class="illus-screen"></div>
              <div class="illus-dots">
                <div class="illus-dot"></div>
                <div class="illus-dot"></div>
                <div class="illus-dot"></div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Footer: 104px — Cancel (left) · Back + Next (right) -->
      <footer class="footer">
        <button class="btn-cancel" aria-label="Cancel">Cancel</button>
        <div class="footer-right">
          <button class="btn-back" aria-label="Back">
            <span class="ms">chevron_left</span>Back
          </button>
          <button class="btn-next" aria-label="Next">Next</button>
        </div>
      </footer>
    </div>

    <script>
      // Methods that need a contextual instruction card shown below
      const instructionMethods = {
        card: {
          title: 'Tap, swipe or insert your card on the card reader',
          sub: 'Your VAT refund goes to this card once approved',
          illustIcon: 'phone_iphone',
        },
        alipay: {
          title: 'Open Alipay and scan the QR code shown at the desk',
          sub: 'Your refund will appear in your Alipay wallet within a few minutes after approval.',
          illustIcon: 'qr_code_2',
        },
        // cash and cashAirport intentionally have no instruction card
      };

      function selectMethod(btn, method) {
        document.querySelectorAll('.option-card').forEach(c => {
          c.classList.remove('selected');
          c.setAttribute('aria-checked', 'false');
        });
        btn.classList.add('selected');
        btn.setAttribute('aria-checked', 'true');

        const card = document.getElementById('instruction-card');
        const inst = instructionMethods[method];
        if (inst) {
          document.getElementById('instruction-title').textContent = inst.title;
          document.getElementById('instruction-sub').textContent = inst.sub;
          card.classList.remove('hidden');
        } else {
          // No guidance needed for this method — hide the card
          card.classList.add('hidden');
        }
      }

      // Keep instruction card state in sync with whichever option is marked selected.
      // This guarantees the card instruction is always visible when Card is selected.
      function syncInstructionFromSelectedOption() {
        const selected = document.querySelector('.option-card.selected');
        if (!selected) return;
        const method = selected.getAttribute('data-method');
        if (!method) return;
        selectMethod(selected, method);
      }

      syncInstructionFromSelectedOption();
    </script>
  </body>
</html>
